<title>BLUE CORE</title>

<style>
:root{--bg:#06111c;--p:#0d2233;--p2:#112b40;--line:#23465b;--text:#eef8fd;--muted:#9db6c4;--blue:#178fd3;--cyan:#54d7ff;--green:#35c98c;--amber:#efbc55;--red:#ff7785;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(145deg,#06111c,#0a2031);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.auth{position:fixed;inset:0;z-index:999;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#06111c,#0b324d)}.auth-card{width:min(440px,100%);background:#fff;color:#143247;border-radius:24px;padding:24px;box-shadow:0 30px 85px #0006}.auth h1{margin:0 0 4px}.auth p{font-size:13px;line-height:1.45;color:#617989}.auth label{display:block;font-size:11px;font-weight:800;margin:11px 0 5px}.auth input{width:100%;padding:13px;border:1px solid #cad9e1;border-radius:11px;background:#f8fbfc;color:#142d3d;font-size:16px}.row{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#14334a;color:#fff;padding:9px 12px;border-radius:10px;font-weight:750}.btn.primary{background:#1588c9;border-color:#1588c9}.btn.good{background:#167c5a;border-color:#167c5a}.btn.light{background:#eaf3f8;color:#12364c;border-color:#dceaf1}.msg{min-height:18px;margin-top:8px;font-size:12px;color:#a13d3d}.install-note{margin-top:12px;padding:9px;border-radius:10px;background:#edf6fa;color:#335767;font-size:12px}.shell{max-width:1560px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;padding:10px 14px;background:#06111cf2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.brand{font-weight:900;color:var(--cyan);letter-spacing:.04em;white-space:nowrap}.client-select{flex:1;min-width:200px;max-width:360px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#0f2739;color:#fff}.spacer{flex:1}.cloud{font-size:11px;color:var(--muted);white-space:nowrap}.tabs{display:flex;gap:7px;overflow:auto;padding:9px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--line);background:#0d2233;color:#bdd1dc;padding:9px 12px;border-radius:999px;font-weight:750}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}main{padding:14px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.card{grid-column:span 12;background:linear-gradient(180deg,var(--p),#0a1d2c);border:1px solid var(--line);border-radius:17px;padding:14px}.card.half{grid-column:span 6}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted);font-size:12px}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.kpi{background:#081a27;border:1px solid var(--line);border-radius:12px;padding:10px}.kpi b{display:block;font-size:20px}.kpi small{color:var(--muted)}.alert{padding:9px 11px;border-radius:11px;margin:7px 0;border:1px solid var(--line);font-size:13px}.alert.red{background:#3a1b25;border-color:#823645}.alert.amber{background:#372e18;border-color:#725b28}.alert.green{background:#123426;border-color:#27634a}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field label{display:block;font-size:10px;text-transform:uppercase;color:#94afbf;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#071722;color:#fff;border-radius:9px;padding:9px;font-size:14px}.field textarea{min-height:76px;resize:vertical}.wide{grid-column:1/-1}.sectionbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.pill{padding:5px 8px;border-radius:999px;background:#15344a;font-size:10px;font-weight:800}.plan-session{margin:12px 0;border:1px solid var(--line);border-radius:13px;overflow:hidden}.plan-head{padding:9px 11px;background:#113149;font-weight:850}.exercise{display:grid;grid-template-columns:minmax(150px,2fr) 65px 90px 82px 82px minmax(130px,1fr);gap:6px;padding:7px;border-top:1px solid #173549}.exercise input,.testrow input{width:100%;background:#071722;color:#fff;border:1px solid #25485c;border-radius:7px;padding:7px}.testrow{display:grid;grid-template-columns:minmax(160px,2fr) 105px 105px 120px minmax(150px,2fr);gap:6px;margin:7px 0}.history-item{border:1px solid var(--line);border-radius:11px;padding:8px;margin:7px 0}.history-item summary{cursor:pointer;font-weight:750}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.manager{display:grid;grid-template-columns:1fr 150px auto;gap:8px}.manager input,.manager select{background:#071722;color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px}.float{position:fixed;right:15px;bottom:max(15px,env(safe-area-inset-bottom));z-index:80}.float .btn{box-shadow:0 8px 25px #0007}@media(max-width:900px){.card.half{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.exercise{grid-template-columns:1fr 62px 86px}.exercise .optional{display:none}.testrow{grid-template-columns:1fr 90px 85px}.testrow .optional{display:none}.top{flex-wrap:wrap}.client-select{order:3;min-width:100%;max-width:none}.manager{grid-template-columns:1fr}.float{left:12px;right:12px}.float .btn{width:100%}}@media(max-width:520px){main{padding:9px}.tabs{padding:8px 9px}.card{padding:10px}.kpis{grid-template-columns:1fr 1fr}.exercise{grid-template-columns:1fr 55px 75px}.testrow{grid-template-columns:1fr 85px}.testrow .unit{display:none}.brand{font-size:14px}.cloud{font-size:9px}}
</style>
</head>
<body>
<div id="auth" class="auth"><div class="auth-card"><h1>BLUE CORE</h1><p>Uma única app para telemóvel, tablet, PC e portátil. Os clientes só ficam disponíveis depois do login.</p><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="nome@email.pt"><label>Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" placeholder="Mínimo 8 caracteres"><div class="row" style="margin-top:14px"><button id="login" class="btn primary" style="flex:1">Entrar</button><button id="signup" class="btn light" style="flex:1">Criar password</button></div><button id="installAuth" class="btn light hidden" style="width:100%;margin-top:9px">Instalar BLUE CORE</button><div id="authMsg" class="msg"></div><div class="install-note"><b>Android/Windows:</b> usa “Instalar aplicação”. <b>iPhone/iPad:</b> Safari → Partilhar → Adicionar ao ecrã principal.</div></div></div>
<div id="app" class="shell hidden"><header class="top"><div class="brand">BLUE CORE</div><select id="clientSelect" class="client-select"></select><span id="cloud" class="cloud">A carregar…</span><div class="spacer"></div><button id="installTop" class="btn hidden">Instalar</button><button id="logout" class="btn">Sair</button></header><nav id="tabs" class="tabs"></nav><main id="view"></main><div class="float"><button id="save" class="btn good">Guardar</button></div></div>
<script src="https://vfwkxlcamtcrmdsuxmyz.supabase.co/functions/v1/blue-core-app/app.js"></script>
