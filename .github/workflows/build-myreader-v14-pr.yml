name: Build MyReader v1.4 APK PR

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    if: github.head_ref == 'myreader-stable-v1-build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Recreate and verify MyReader v1.4 project
        run: |
          base64 -d .myreader-stable/v14_project.b64 > /tmp/MyReader-v1.4-project.zip
          echo "fd8190a4ae764f29d9853d8aa3ef3376876baaa0a9c6d6a94daa593c005d4975  /tmp/MyReader-v1.4-project.zip" | sha256sum -c -
          unzip -t /tmp/MyReader-v1.4-project.zip
          unzip -q /tmp/MyReader-v1.4-project.zip -d /tmp/myreader-v14
          cd /tmp/myreader-v14/myreader_v14_project
          grep -q "versionCode 140" app/build.gradle
          grep -q "versionName '1.4'" app/build.gradle
          grep -q "applicationId 'pt.myreader.stable'" app/build.gradle
          grep -q "onRangeStart" app/src/main/java/pt/myreader/stable/BookEngine.java
          grep -q "progress_char_" app/src/main/java/pt/myreader/stable/BookEngine.java
          grep -q "jumpToChapter" app/src/main/java/pt/myreader/stable/BookEngine.java
          grep -q "jumpToPage" app/src/main/java/pt/myreader/stable/BookEngine.java
          grep -q "Capítulos — toca para saltar" app/src/main/assets/index.html
          grep -q "Biblioteca audível · v1.4" app/src/main/assets/index.html

      - name: Build unsigned release APK
        working-directory: /tmp/myreader-v14/myreader_v14_project
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK metadata
        run: |
          APK=/tmp/myreader-v14/myreader_v14_project/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='pt.myreader.stable' versionCode='140' versionName='1.4'" /tmp/badging.txt
          cp "$APK" MyReader-v1.4-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: MyReader-v1.4-unsigned
          path: MyReader-v1.4-unsigned.apk
          if-no-files-found: error
          retention-days: 14
