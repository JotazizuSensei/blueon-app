name: Build MyReader APK

on:
  push:
    branches:
      - myreader-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Recreate MyReader project
        run: |
          mkdir -p myreader-build
          cat .myreader/payload_*.b64 > /tmp/myreader_payload.b64
          base64 -d /tmp/myreader_payload.b64 > /tmp/myreader_payload.zip
          unzip -q /tmp/myreader_payload.zip -d myreader-build
          test -f myreader-build/settings.gradle
          test -f myreader-build/app/src/main/AndroidManifest.xml

      - name: Build installable APK
        working-directory: myreader-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp myreader-build/app/build/outputs/apk/debug/app-debug.apk MyReader-v0.3-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyReader-v0.3-Android
          path: MyReader-v0.3-Android.apk
          if-no-files-found: error
          retention-days: 30
