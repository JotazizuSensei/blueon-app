name: Build MyReader Stable APK PR

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    if: github.head_ref == 'myreader-stable-v1-build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Recreate MyReader project
        run: |
          mkdir -p myreader-build
          cat .myreader-stable/fix_*.b64 > /tmp/myreader_payload.b64
          base64 -d /tmp/myreader_payload.b64 > /tmp/myreader_payload.zip
          unzip -q /tmp/myreader_payload.zip -d myreader-build
          test -f myreader-build/settings.gradle
          test -f myreader-build/app/src/main/AndroidManifest.xml

      - name: Build unsigned release APK
        working-directory: myreader-build
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare artifacts
        run: |
          cp myreader-build/app/build/outputs/apk/release/app-release-unsigned.apk MyReader-v1.0-unsigned.apk
          mkdir -p apk-tools/lib
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" apk-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" apk-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" apk-tools/lib/
          chmod +x apk-tools/apksigner apk-tools/zipalign

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: MyReader-v1.0-unsigned
          path: MyReader-v1.0-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-tools
          path: apk-tools
          if-no-files-found: error
          retention-days: 14
