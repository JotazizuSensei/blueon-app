name: Dump MyReader v1.4 source

on:
  pull_request:
    branches: [ main ]

jobs:
  dump:
    if: github.head_ref == 'myreader-stable-v1-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        run: |
          cat .myreader-stable/v14p_*.b64 | tr -d '\n\r' | base64 -d > /tmp/MyReader-v1.4-project.zip
          unzip -q /tmp/MyReader-v1.4-project.zip -d /tmp/v14
      - name: Verify project
        run: |
          grep -q "versionCode 140" /tmp/v14/myreader_v14_project/app/build.gradle
          grep -q "versionName '1.4'" /tmp/v14/myreader_v14_project/app/build.gradle
          grep -q "applicationId 'pt.myreader.stable'" /tmp/v14/myreader_v14_project/app/build.gradle
          unzip -t /tmp/MyReader-v1.4-project.zip >/dev/null
      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: MyReader-v1.4-project-source
          path: /tmp/MyReader-v1.4-project.zip
          if-no-files-found: error
          retention-days: 7
