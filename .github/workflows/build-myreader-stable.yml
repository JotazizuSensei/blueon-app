name: Build MyReader Stable APK

on:
  push:
    branches:
      - myreader-stable-v1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Recreate MyReader v1.1 project
        run: |
          mkdir -p myreader-build
          cat .myreader-stable/v11_*.b64 > /tmp/myreader_payload.b64
          base64 -d /tmp/myreader_payload.b64 > /tmp/myreader_payload.zip
          unzip -q /tmp/myreader_payload.zip -d myreader-build
          test -f myreader-build/settings.gradle
          test -f myreader-build/app/src/main/AndroidManifest.xml
          grep -q "versionCode 110" myreader-build/app/build.gradle

      - name: Build unsigned release APK
        working-directory: myreader-build
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare artifact
        run: cp myreader-build/app/build/outputs/apk/release/app-release-unsigned.apk MyReader-v1.1-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: MyReader-v1.1-unsigned
          path: MyReader-v1.1-unsigned.apk
          if-no-files-found: error
          retention-days: 14
