name: Build MyReader v1.2 APK PR

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    if: github.head_ref == 'myreader-stable-v1-build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Recreate and verify MyReader v1.2 project
        run: |
          mkdir -p myreader-build
          cat .myreader-stable/v12x_*.b64 > /tmp/myreader_payload.b64
          base64 -d /tmp/myreader_payload.b64 > /tmp/myreader_payload.zip
          echo "d7d867817de50978e6d8484db5922ddf616684f0a38b3cd2dcb89c18fa975a61  /tmp/myreader_payload.zip" | sha256sum -c -
          unzip -t /tmp/myreader_payload.zip
          unzip -q /tmp/myreader_payload.zip -d myreader-build
          test -f myreader-build/settings.gradle
          test -f myreader-build/app/src/main/AndroidManifest.xml
          grep -q "namespace 'pt.myreader.stable'" myreader-build/app/build.gradle
          grep -q "applicationId 'pt.myreader.stable'" myreader-build/app/build.gradle
          grep -q "versionCode 120" myreader-build/app/build.gradle
          grep -q "versionName '1.2'" myreader-build/app/build.gradle
          grep -q 'migrateEngineState' myreader-build/app/src/main/java/pt/myreader/stable/BookEngine.java
          grep -q 'runDiagnostics' myreader-build/app/src/main/java/pt/myreader/stable/BookEngine.java

      - name: Build unsigned release APK
        working-directory: myreader-build
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK metadata
        run: |
          APK=myreader-build/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='pt.myreader.stable' versionCode='120' versionName='1.2'" /tmp/badging.txt
          cp "$APK" MyReader-v1.2-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: MyReader-v1.2-unsigned
          path: MyReader-v1.2-unsigned.apk
          if-no-files-found: error
          retention-days: 14
